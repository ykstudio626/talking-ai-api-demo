<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>セラピストさくら</title>
</head>
<body>
  <div id="site-header" class="fixed top-0 left-0 right-0 z-10 bg-white/60 px-3 py-2 pb-1 flex flex-col md:flex-row justify-between items-start md:items-center space-y-2 md:space-y-0 max-w-[800px] mx-auto">
    <div>
      <h1 class="text-2xl font-bold">セラピストさくら v0.9</h1>
      <!-- <span class="sm-text ml-3"><a href="https://github.com/ykstudio626/talking-ai-api-demo" target="_blank">GitHub</a></span> -->
      <span class="sm-text">※会話の記録は行なっていません。自由にお楽しみください！</span>
    </div>
    
    <div class="flex items-center space-x-2">
      <div id="controls" class="flex items-center">
        <button id="startBtn" class="rounded-lg border border-gray-300 px-3 py-1 mr-2 w-28 md:w-32 whitespace-nowrap text-sm md:text-base">▶ 会話を開始</button>
        <button id="stopBtn" class="rounded-lg border border-gray-300 px-3 py-1 mr-2 whitespace-nowrap text-sm md:text-base" disabled>⏹ 会話を終了</button>
      </div>
      <button id="fullscreenToggle" class="hidden opacity-40 hover:opacity-80 transition-opacity focus:outline-none p-1 flex items-center justify-center shrink-0" title="全画面表示">
        <img src="/full-screen.svg" alt="Fullscreen Toggle" class="w-6 h-6" style="filter: invert(30%);" />
      </button>
    </div>
  </div>

  <div id="logContainer"></div>

  <div id="maintenanceOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center pointer-events-none">
    <p class="text-2xl font-bold text-red-600 bg-pink-100/90 px-10 py-5 rounded-2xl shadow">
      SORRY! メンテナンス中
    </p>
  </div>

  <div id="demoLimitOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center pointer-events-none">
    <p class="text-2xl font-bold text-red-600 bg-pink-100/90 px-10 py-5 rounded-2xl shadow">
      デモの回数制限に達しました
    </p>
  </div>

  <div id="avatarWrapper">
    <canvas id="avatarCanvas"></canvas>
    <div id="avatarLoading">
      <div style="text-align:center">
        <img src="./loading.gif" alt="読み込み中…" /><br>
        <span style="font-size:13px; color:#888;">アバター読み込み中、少しお待ちください…</span>
      </div>
    </div>
    <div id="chatContainer"></div>
  </div>

  <span id="timerDisplay" class="fixed bottom-4 right-4 z-20 text-white text-sm font-medium pointer-events-none"></span>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
